[project]
name = "docspilot"
version = "0.1.0"
description = "Support assistant demo: RAG, tools, evals, guardrails."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "prometheus-client>=0.21",
  "pyjwt[crypto]>=2.9",
  "mcp>=2.0",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[project.optional-dependencies]
# Local intent classifier (fine-tuning experiment). Not needed to run the service.
finetune = [
  "scikit-learn>=1.5",
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "accelerate>=1.0",
  "numpy>=1.26",
]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "types-pyyaml",
  "numpy>=1.26",  # benchmarks / experiments only
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docspilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs Postgres (set TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# synthetic-data generation uses `random` deliberately (not for security)
"src/docspilot/finetune/**" = ["S311", "T201", "E501"]
"scripts/**" = ["S310"]
"src/docspilot/bench/**" = ["E501", "T201", "E731", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torch.*", "peft.*", "transformers.*", "sklearn.*", "langgraph.*", "langchain_core.*", "jsonschema.*"]
ignore_missing_imports = true
