<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocsPilot</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <header><h1>DocsPilot</h1><span>Acme Billing support assistant</span></header>
  <div id="keybar" class="keybar" hidden>
    <input id="key" type="password" autocomplete="off" placeholder="API key">
    <button id="savekey" type="button">Save</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="2" maxlength="4000" placeholder="Ask a question…" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script src="/app.js" defer></script>
</body>
</html>
