<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocsPilot</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #e2e2dd; --accent: #2f5bea; --user: #e8edfd; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --text: #ececE8; --muted: #9a9a93;
            --border: #333330; --accent: #7c9bff; --user: #26304f; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
         padding: 0 16px; }
  header { padding: 20px 0 12px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 0 16px; display: flex; flex-direction: column;
         gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 88%; white-space: pre-wrap;
         overflow-wrap: anywhere; border: 1px solid var(--border); background: var(--panel); }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg.error { color: var(--error); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 12px 0 20px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
             padding: 10px 12px; font: inherit; background: var(--panel); color: var(--text); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <header><h1>DocsPilot</h1><span>Acme Billing support assistant</span></header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="2" maxlength="4000" placeholder="Ask a question…" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];

function bubble(role, text = "") {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;           // textContent: model output is never interpreted as HTML
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// Parse an SSE stream from fetch (EventSource can't POST).
async function* sse(response) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buf += value.replace(/\r\n/g, "\n");
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
      let event = "message", data = "";
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) yield { event, data: JSON.parse(data) };
    }
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; send.disabled = true;
  history.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("assistant");
  let answer = "";
  try {
    const res = await fetch("/v1/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) throw new Error((await res.json()).detail ?? res.statusText);
    for await (const { event, data } of sse(res)) {
      if (event === "delta") { answer += data.text; out.textContent = answer; }
      else if (event === "error") { out.classList.add("error"); out.textContent = data.message; }
      else if (event === "done") {
        const m = document.createElement("div"); m.className = "meta";
        m.textContent = `${data.model} · ${data.usage.input_tokens} in / ${data.usage.output_tokens} out`;
        out.appendChild(m);
      }
      log.scrollTop = log.scrollHeight;
    }
    if (answer) history.push({ role: "assistant", content: answer });
    else history.pop();           // keep roles alternating after a failed turn
  } catch (err) {
    out.classList.add("error"); out.textContent = String(err.message ?? err);
    history.pop();
  } finally {
    send.disabled = false; input.focus();
  }
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
