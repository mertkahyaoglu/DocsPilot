services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docspilot
      POSTGRES_PASSWORD: docspilot
      POSTGRES_DB: docspilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docspilot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
